[project]
name = "mmscraper"
version = "0.2.2"

requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kaung Myat Thu", email = "htetmyet157@gmail.com"}
]
keywords = ["pdf", "zawgyi", "unicode", "burmese", "myanmar", "text-extraction", "font-embedding"]

dependencies = [
    "flask>=3.0.0",
    "fpdf2>=2.8.8",
    "pikepdf>=8",
    # python/scribdl (Scribd downloader)
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    # python/search_crawl.py + python/download.py
    "httpx>=0.27",
    "tenacity>=9.0.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Headless browser support for python/search_crawl.py, for engines that answer
# plain HTTP with 403. Install with:  uv sync --extra browser
browser = ["playwright>=1.61.0-1"]

[project.scripts]
search-crawl = "search_crawl:main"
download-books = "download:main"

[tool.pytest.ini_options]
# python/test/ holds scribdl's upstream tests, which download from scribd.com;
# they are not part of `pytest` by default.
testpaths = ["test/crawler.py", "test/download.py"]
pythonpath = ["python"]




