[project]
name = "mmscraper"
version = "0.2.2"

requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kaung Myat Thu", email = "htetmyet157@gmail.com"}
]
keywords = ["pdf", "zawgyi", "unicode", "burmese", "myanmar", "text-extraction", "font-embedding"]

dependencies = [
    "flask>=3.0.0",
    "fpdf2>=2.8.8",
    "pikepdf>=8",
    # python/scribdl (Scribd downloader)
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    # python/search_crawl.py + python/download.py
    "httpx>=0.27",
    "tenacity>=9.0.0",
    "tqdm>=4.66",
]

# No browser dependency. The crawler drives the system Chromium
# (`chromium --headless --dump-dom`), so headless support costs one package from
# your distro -- apk add chromium / pacman -S chromium / apt install chromium --
# and nothing from PyPI. Playwright cannot be installed here anyway: it ships no
# wheel for musl (Alpine), and its bundled Chromium is glibc-only.
#
# On a glibc machine Playwright works and is used when installed:
#   uv pip install playwright && playwright install chromium
# Nothing here depends on it, so no documented command can fail on musl.

[project.scripts]
dsite = "dsite:main"
dsite-download = "dsite_download:main"
crawl = "crawler:main"
search-crawl = "crawler:main"
download-books = "download:main"
linearize-pdfs = "linearize:main"

[tool.pytest.ini_options]
# python/test/ holds scribdl's upstream tests (images.py, text.py),
# which download from scribd.com; they are not part of `pytest` by default.
testpaths = ["test/crawler.py", "test/download.py", "test/linearize_pdfs.py", "test/dsite.py", "test/dsite_download.py"]
pythonpath = ["."]
# importlib mode keeps test/crawler.py from shadowing the crawler module it is
# testing (both would otherwise be imported under the name "crawler").
addopts = "--import-mode=importlib"




